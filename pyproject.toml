[project]
name = "jonghwa-agent"
version = "0.1.0"
description = "개인 이력 및 프로젝트 정보를 기반으로 답변하는 AI 챗봇 에이전트"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.5.2",
    "chromadb==1.5.9",
    "langchain-chroma==1.2.0",
    "langchain-openai==1.8.5",
    "langchain-text-splitters==1.2.0",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jonghwa_agent = ["prompts/*.txt"]
